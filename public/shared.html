<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Transition Agent — Shared with me</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⇄</text></svg>" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">⇄</span>
      <div>
        <h1>Transition Agent</h1>
        <div class="subtitle">Shared with me</div>
      </div>
    </div>
    <div class="actions">
      <a href="/" class="btn ghost">← My brief</a>
      <select id="subjectSelect" class="user-select" title="Select a shared employee" style="display:none"></select>
      <button id="printBtn" class="btn ghost">Print / PDF</button>
      <span id="userBadge" class="user-badge" style="display:none" title="Signed in"></span>
      <a id="logoutLink" href="/logout" class="btn ghost" style="display:none">Sign out</a>
    </div>
  </header>
  <div id="flash" class="flash"></div>

  <div class="layout">
    <nav class="sidenav" id="sidenav"></nav>
    <main id="main">
      <div class="loading" id="loading">Loading shared data…</div>
    </main>
  </div>

  <script src="shared.js"></script>
</body>
</html>
